<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle Brothers — Подбор билда</title>
    <link rel="stylesheet" href="style.css">
<style>
    /* Только дополнительные стили для optimal */
    .input-panel {
        background: #2d251c;
        border: 2px solid #6f552d;
        border-radius: 12px;
        padding: 25px 30px;
        margin-bottom: 25px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px 25px;
    }
    .stat-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    .stat-group label {
        font-size: 13px;
        color: #c7b38a;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .stat-group .row {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    .stat-group input {
        width: 70px;
        padding: 8px 10px;
        background: #3a2e20;
        border: 1px solid #6f552d;
        border-radius: 5px;
        color: #fff;
        font-size: 15px;
        text-align: center;
    }
    .stat-group select {
        padding: 8px 6px;
        background: #3a2e20;
        border: 1px solid #6f552d;
        border-radius: 5px;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
    }
    .btn-row {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-wrap: wrap;
        margin-top: 10px;
    }
    button.primary {
		background: #7b5b2c;
		font-weight: bold;
	}
	button.primary:hover {
		background: #98703a;
	}
    .info-bar {
        background: #2d251c;
        border: 2px solid #6f552d;
        border-radius: 10px;
        padding: 15px 25px;
        margin-bottom: 25px;
        display: none;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }
    .info-bar.active {
        display: flex;
    }
    .info-bar .arch-label {
        font-size: 20px;
        font-weight: bold;
        color: #d4af37;
    }
    .info-bar .stats-summary {
        font-size: 14px;
        color: #c7b38a;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }
    .info-bar .stats-summary span {
        white-space: nowrap;
    }
    .info-bar .score-badge {
        background: #4a3a20;
        border: 1px solid #d4af37;
        border-radius: 20px;
        padding: 5px 15px;
        font-size: 14px;
        color: #f0d79a;
    }
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.75);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }
    .modal-overlay.active {
        display: flex;
    }
    .modal {
        background: #2d251c;
        border: 2px solid #d4af37;
        border-radius: 14px;
        padding: 30px;
        max-width: 550px;
        width: 90%;
        text-align: center;
    }
    .modal h3 {
        color: #d4af37;
        margin-bottom: 20px;
        font-size: 22px;
    }
    .modal .archetype-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
    }
    .modal .archetype-btn {
        background: #3a2e20;
        border: 2px solid #6f552d;
        color: #fff;
        padding: 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.2s;
        text-align: left;
    }
    .modal .archetype-btn:hover {
        border-color: #d4af37;
        background: #4a3a28;
    }
    .modal .arch-name {
        font-weight: bold;
        color: #f0d79a;
    }
    .modal .arch-desc {
        font-size: 13px;
        color: #999;
        margin-top: 4px;
    }

    @media (max-width: 900px) {
        .input-panel {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 550px) {
        .input-panel {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

	<!-- Панель ввода -->
    <div class="input-panel" id="inputPanel">
        <div class="stat-group">
            <label>Здоровье (ОЗ)</label>
            <div class="row">
                <input type="number" id="hp" value="55" min="20" max="80">
                <select id="hpStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Выносливость</label>
            <div class="row">
                <input type="number" id="fat" value="95" min="60" max="130">
                <select id="fatStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Решимость</label>
            <div class="row">
                <input type="number" id="res" value="35" min="10" max="65">
                <select id="resStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Инициатива</label>
            <div class="row">
                <input type="number" id="init" value="105" min="70" max="130">
                <select id="initStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Атака ближнего боя</label>
            <div class="row">
                <input type="number" id="matk" value="52" min="30" max="80">
                <select id="matkStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Атака дальнего боя</label>
            <div class="row">
                <input type="number" id="ratk" value="35" min="20" max="65">
                <select id="ratkStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Защита ближнего боя</label>
            <div class="row">
                <input type="number" id="mdef" value="2" min="-10" max="25">
                <select id="mdefStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="stat-group">
            <label>Защита дальнего боя</label>
            <div class="row">
                <input type="number" id="rdef" value="2" min="-15" max="20">
                <select id="rdefStars"><option value="0">☆</option><option value="1">★</option><option value="2">★★</option><option value="3">★★★</option></select>
            </div>
        </div>
        <div class="btn-row">
            <button class="primary" id="generateBtn">🎯 Подобрать билд</button>
            <button id="resetBtn">Сбросить</button>
        </div>
    </div>

    <!-- Инфо-бар с архетипом -->
    <div class="info-bar" id="infoBar">
        <span class="arch-label" id="archLabel"></span>
        <div class="stats-summary" id="statsSummary"></div>
        <span class="score-badge" id="scoreBadge"></span>
    </div>

    <!-- Сетка перков -->
    <div class="perk-grid" id="perkGrid">
        <div class="placeholder">Введите характеристики братка и нажмите «Подобрать билд»</div>
    </div>
</div>

<!-- Модальное окно выбора архетипа -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <h3>Братец подходит под несколько ролей</h3>
        <div class="archetype-list" id="archetypeList"></div>
        <button id="modalCancel">Отмена</button>

    { name: "Ученик", category: "normal", tier: 1, order: 9, icon: "icons/Student.png", description: "Всё можно изучить, если прикладывать усилия. Персонаж с навыком 'Ученик' получает дополнительно <span class='green'>20%</span> опыта за бой. По достижении одиннадцатого уровня он получит дополнительный навык, а этот станет неактивным. При выборе происхождения 'Погонщики рабов' непрощённые получат дополнительный навык на седьмом уровне." },
    { name: "Здоровяк", category: "normal", tier: 1, order: 3, icon: "icons/Colossus.png", description: "К бою готов! Увеличивает ОЗ на <span class='green'>25%</span>, что снижает шанс получить травму, когда персонажу наносят урон." },
    { name: "Быстрая адаптация", category: "normal", tier: 1, order: 1, icon: "icons/Fast Adaptation.png", description: "Подстройся под движения противника! Персонаж получает <span class='green'>+10%</span> к шансу на попадание за каждый промах по врагу. Бонус накапливается, пока удар не достигнет цели." },
    { name: "Следопыт", category: "normal", tier: 1, order: 6, icon: "icons/Path.png", description: "Персонажу с этим навыком понадобится на <span class='green'>1</span> ОД меньше при передвижении по любой местности вплоть до минимума в 2 ОД за клетку, а затраты выносливости снижены в 2 раза. Смена высоты теперь не требует дополнительных затрат ОД." },
    { name: "Передышка", category: "normal", tier: 1, order: 8, icon: "icons/Recover.png", description: "Становится доступным умение 'Передышка', позволяющее пропустить ход, чтобы снизить накопленную усталость на <span class='green'>50%</span>." },
    { name: "Выдержка", category: "normal", tier: 2, order: 14, icon: "icons/Resilient.png", description: "Один за всех и все за одного! Время действия любого отрицательного эффекта, имеющего продолжительность (отравлен, очарован), уменьшено на <span class='green'>1</span> ход. Эффекты, слабеющие со временем (гоблинский яд и т.п.), ослабляются до своего минимума с самого начала действия." },
    { name: "Сумки и пояса", category: "normal", tier: 1, order: 5, icon: "icons/Bags.png", description: "Становятся доступны две дополнительные ячейки. Помещённые в поясные сумки вещи, за исключением двуручного оружия, больше не дают штрафов к выносливости. *Примечание: бинты, противоядие и гоблинский яд дают штраф к выносливости вопреки описанию." },
    { name: "В яблочко", category: "normal", tier: 2, order: 11, icon: "icons/Bull.png", description: "Ровно промеж глаз! Штраф к точности попадания по цели вне прямой линии огня снижается с <span class='red'>75%</span> до <span class='red'>50%</span> для любого стрелкового и метательного оружия." },
    { name: "Твердолобый", category: "normal", tier: 2, order: 15, icon: "icons/Steel.png", description: "Попадания по голове больше не вызывают критических повреждений у данного персонажа, что также снижает вероятность получения травм головы." },
    { name: "Девять жизней", category: "normal", tier: 1, order: 4, icon: "icons/Nine Lives.png", description: "Один раз за бой, получив смертельный удар, персонаж выживет с парой ОЗ. Все отрицательные эффекты, наносящие урон (отравление, кровотечение), при этом излечиваются. Следующее попадание, вполне вероятно, всё же прикончит его, но улучшенная защита до следующего хода персонажа поможет пережить и это." },
    { name: "Воодушевление", category: "normal", tier: 3, order: 24, icon: "icons/Rally.png", description: "Становится доступным умение 'Воодушевление', с помощью которого можно повысить боевой дух ближайших союзников, если они нерешительны или вовсе бегут с поля боя. Чем выше решимость персонажа, который применяет умение, тем выше шанс на успех." },
    { name: "Провокация", category: "normal", tier: 3, order: 25, icon: "icons/Taunt.png", description: "Становится доступным умение 'Провокация', которое заставляет противников забыть о защите и броситься в атаку на персонажа, применившего умение, вместо более предпочтительных целей." },

    { name: "Уклонение", category: "normal", tier: 2, order: 12, icon: "icons/Dodge.png", description: "Слишком быстр для тебя! Персонаж получает <span class='green'>15%</span> от текущего значения инициативы в качестве бонуса к защите в ближнем и дальнем бою." },
    { name: "Сила воли", category: "normal", tier: 2, order: 13, icon: "icons/Mind.png", description: "Железная воля не позволит сбиться с праведного пути. Решимость увеличивается на <span class='green'>25%</span>." },
    { name: "Одарённый", category: "normal", tier: 2, order: 17, icon: "icons/Gifted.png", description: "Одарённому наёмнику живётся легче. Персонаж моментально получит уровень (не учитывающийся в счетчике уровней персонажа), позволяющий увеличить его характеристики на максимально возможное значение без учёта талантов." },
    { name: "Командная работа", category: "normal", tier: 3, order: 18, icon: "icons/Back.png", description: "Один в поле не воин! Бонус к шансу попасть в ближнем бою удваивается с базовых +5% до <span class='green'>+10%</span> за каждого союзника, окружившего и отвлекающего цель." },
    { name: "Предвидение", category: "normal", tier: 3, order: 19, icon: "icons/Antisipation.png", description: "С навыком 'Предвидение' персонаж, атакованный любым стрелковым оружием, получает бонус к защите в дальнем бою. За каждую клетку до стрелка защита увеличивается на <span class='green'>1 + 10%</span> от текущего значения защиты персонажа в дальнем бою, но не менее, чем на <span class='green'>+10</span> к защите в дальнем бою." },
    { name: "Мастер щита", category: "normal", tier: 3, order: 20, icon: "icons/Shield.png", description: "Персонаж обучается обращению с щитом, чтобы отклонять удары при помощи щита, а не просто блокировать их. Защитные бонусы щита увеличиваются на <span class='green'>25%</span>. Эффект также распространяется на бонус от умения 'Стена щитов'. Кроме того, урон принимаемый щитом уменьшен на <span class='green'>50%</span> вплоть до минимума в 1 единицу прочности. Умение 'Отбрасывание' получает <span class='green'>+15%</span> к шансу на попадание." },
    { name: "Двужильный", category: "normal", tier: 3, order: 21, excludes: ["Ловкач"], icon: "icons/Brawny.png", description: "Штраф к выносливости и инициативе от надетых брони и шлема сокращается на <span class='green'>30%</span>." },

    { name: "Палач", category: "normal", tier: 2, order: 10, icon: "icons/Execut.png", description: "Наносите дополнительные <span class='green'>20%</span> урона по целям, страдающим от любой травмы, например, от сломанной руки." },
    { name: "Рокировка", category: "normal", tier: 3, order: 23, icon: "icons/Rotation.png", description: "Становится доступным умение 'Рокировка', позволяющее двум персонажам поменяться местами, игнорируя зону контроля противника, при условии, что они оба не оглушены, не обездвижены или не выведены из строя другим способом." },

// ==================== ЗАМЕНА null НА КОНКРЕТНЫЕ МАСТЕРСТВА ====================
function fillMasterySlots(build) {
    const filled = build.map(perkName => {
        if (perkName === null && build.includes("Длина имеет значение")) {
            return reachMasteries[Math.floor(Math.random() * reachMasteries.length)];
        }
        if (perkName === null && build.includes("Дуэлянт")) {
            return duelistMasteries[Math.floor(Math.random() * duelistMasteries.length)];
        }
        if (perkName === null) {
            return reachMasteries[Math.floor(Math.random() * reachMasteries.length)];
        }
        return perkName;
    });

    // Если выпал Мастер кистеня — меняем один перк на Охотник за головами
    if (filled.includes("Мастер кистеня") && !filled.includes("Охотник за головами")) {
        const expendable = [
            "Длина имеет значение",
            "Здоровяк",
            "Следопыт",
            "Подавление"
        ];

        for (const perk of expendable) {
            const index = filled.indexOf(perk);
            if (index !== -1) {
                filled[index] = "Охотник за головами";
                break;
            }
        }
    }

    return filled;
}

function getExpectedInvestments(archetype) {
    const priorities = {
        "Лучник":                { main: ["ratk", "init", "rdef"], fallback: ["hp", "fat"], forbidden: ["matk"] },
        "Арбалетчик/Метатель":   { main: ["ratk", "init", "rdef"], fallback: ["hp", "fat"], forbidden: ["matk"] },
        "Двуручник":             { main: ["matk", "mdef", "fat"], fallback: ["hp", "res"], forbidden: ["ratk"] },
        "Дуэлянт":               { main: ["matk", "mdef", "init"], fallback: ["hp", "fat"], forbidden: ["ratk"] },
        "Танк лёгкий":           { main: ["mdef", "init", "hp"], fallback: ["fat", "res"], forbidden: ["ratk"] },
        "Танк тяжёлый":          { main: ["mdef", "fat", "hp"], fallback: ["res"], forbidden: ["ratk"] },
        "Сержант лёгкий":        { main: ["res", "init", "rdef"], fallback: ["hp", "fat"], forbidden: ["ratk"] },
        "Сержант тяжёлый":       { main: ["res", "fat", "rdef"], fallback: ["hp"], forbidden: ["ratk"] },
        "Второрядник лёгкий":    { main: ["matk", "rdef", "init"], fallback: ["hp", "fat"], forbidden: ["ratk"] },
        "Второрядник тяжёлый":   { main: ["matk", "rdef", "fat"], fallback: ["hp"], forbidden: ["ratk"] },
        "Гибрид":                { main: ["matk", "ratk", "init"], fallback: ["hp", "mdef", "fat"], forbidden: [] },
		"Рапирщик":            	 { main: ["matk", "init", "fat"], fallback: ["hp", "mdef"], forbidden: ["ratk"] },
		"Кинжальщик":            { main: ["matk", "mdef", "init"], fallback: ["hp", "fat"], forbidden: ["ratk"] },
		"Спартанец":             { main: ["mdef", "fat", "hp"], fallback: ["matk", "init"], forbidden: ["ratk"] },
		"Безфатиговый тяж":      { main: ["matk", "mdef", "hp"], fallback: ["res"], forbidden: ["ratk", "fat"] }
    };

    const p = priorities[archetype] || { main: ["matk", "mdef", "fat"], fallback: ["hp"], forbidden: ["ratk"] };
    const investments = {};
    const allStats = ["hp", "fat", "res", "init", "matk", "ratk", "mdef", "rdef"];

    // Всем по нулям
    for (const stat of allStats) investments[stat] = 0;

    // Основные — 8 каждая (3 стата × 8 = 24)
    for (const stat of p.main) {
        investments[stat] = 8;
    }
    // Вторичные — делим 6 прокачек между ними поровну
    const fb = p.fallback || [];
    if (fb.length > 0) {
        const perFallback = Math.floor(6 / fb.length);
        const remainder = 6 % fb.length;
        for (let i = 0; i < fb.length; i++) {
            investments[fb[i]] = perFallback + (i < remainder ? 1 : 0);
        }
    }
    // Запрещённые — 0
    for (const stat of (p.forbidden || [])) {
        investments[stat] = 0;
    }

    return investments;
}

function calcFinalsForArchetype(inputStats, stars, archetype) {
    const investments = getExpectedInvestments(archetype);
    const finals = {};
    for (const key of Object.keys(inputStats)) {
        const gain = growth[key][stars[key]];
        const levels = investments[key] || 0;
        finals[key] = Math.round(inputStats[key] + gain.avg * levels);
    }
    return finals;
}

function getThresholdsForArchetype(archetype) {
    const thresholds = {
        "Лучник": {
            min: { ratk: 85 }
        },
        "Арбалетчик/Метатель": {
            min: { ratk: 70 },
            max: { ratk: 85 }   // < 85
        },
        "Двуручник": {
            min: { matk: 85, mdef: 20, fat: 130 }
        },
        "Дуэлянт": {
            min: { matk: 80, init: 140 }
        },
        "Танк лёгкий": {
            min: { mdef: 35, init: 140, hp: 80 },
            max: { matk: 70 }   // < 70 — опционально, если нужно
        },
        "Танк тяжёлый": {
            min: { mdef: 35, fat: 140, hp: 85 },
            max: { matk: 70 }   // < 70
        },
        "Сержант лёгкий": {
            min: { res: 80, init: 130 }
        },
        "Сержант тяжёлый": {
            min: { res: 80, fat: 130 }
        },
        "Второрядник лёгкий": {
            min: { matk: 75, init: 130 }
        },
        "Второрядник тяжёлый": {
            min: { matk: 75, fat: 130 }
        },
        "Гибрид": {
            min: { matk: 70, ratk: 70, init: 130 }
        },
		"Рапирщик": { 
			min: { matk: 90, init: 140, fat: 115 } 
		},
        "Кинжальщик": { 
			min: { matk: 75, mdef: 30, init: 120 } 
		},
        "Спартанец": { 
			min: { matk: 60, fat: 100 }, max: { matk: 70, mdef: 20} 
		},
        "Безфатиговый тяж": { 
			min: { matk: 75, mdef: 25 }, max: { fat: 115 } 
		}
    };
    return thresholds[archetype] || { min: {} };
}

function meetsThresholds(stats, archetype) {
    const t = getThresholdsForArchetype(archetype);
    let totalShortfall = 0;

    // Проверяем нижние пороги и считаем недобор
    for (const [stat, minVal] of Object.entries(t.min || {})) {
        const val = stats[stat] || 0;
        if (val < minVal) {
            totalShortfall += (minVal - val);
        }
    }
    // Проверяем верхние пороги
    for (const [stat, maxVal] of Object.entries(t.max || {})) {
        const val = stats[stat] || 0;
        if (val >= maxVal) return false; // превышение не спасаем
    }

    // Проходим, если недобор ≤ 4 (Одарённый спасёт)
    return totalShortfall <= 4;
}

function calculateScore(finals, stars, archetype) {
    const t = getThresholdsForArchetype(archetype);
    const priorities = getExpectedInvestments(archetype);
    
    let score = 0;
    let totalChecks = 0;

    // 1. Очки за превышение порогов (как раньше)
    for (const [stat, minVal] of Object.entries(t.min || {})) {
        const val = finals[stat] || 0;
        if (val >= minVal) {
            score += (val - minVal);
            totalChecks++;
        }
    }
    for (const [stat, maxVal] of Object.entries(t.max || {})) {
        const val = finals[stat] || 0;
        if (val < maxVal) {
            score += (maxVal - val);
            totalChecks++;
        }
    }

    // 2. Бонус за звёзды в ключевых характеристиках
    const starBonus = { 0: 0, 1: 3, 2: 6, 3: 10 };
    
    for (const [stat, investment] of Object.entries(priorities)) {
        const starCount = stars[stat] || 0;
        
        if (investment >= 8) {
            // Основная характеристика — полный бонус
            score += starBonus[starCount];
            totalChecks++;
        } else if (investment >= 3) {
            // Вторичная — половинный бонус
            score += Math.floor(starBonus[starCount] / 2);
        }
        // Запрещённые (investment === 0) — звёзды не дают бонуса, но и не штрафуют
    }

    // Средний счёт
    return totalChecks > 0 ? Math.round(score / totalChecks) : 0;
}

function adjustBuildForShortfall(archetype, finals) {
    const template = [...buildTemplates[archetype]];
    const t = getThresholdsForArchetype(archetype);
    let shortfall = 0;

    // Считаем общий недобор по ключевым статам
    for (const [stat, minVal] of Object.entries(t.min || {})) {
        const val = finals[stat] || 0;
        if (val < minVal) {
            shortfall += (minVal - val);
        }
    }

    // Недобора нет — возвращаем как есть
    if (shortfall === 0) return template;

    // Недобор больше 4 — не спасаем
    if (shortfall > 4) return template;

    // Одарённый уже есть — нечего менять
    if (template.includes("Одарённый")) return template;

    // Перки на замену (первый — самый expendable)
    const replaceable = {
        "Лучник": ["Подавление"],
        "Арбалетчик/Метатель": ["Мастер арбалета и пищали"],
        "Двуручник": ["Длина имеет значение"],
        "Дуэлянт": ["Подавление"],
        "Танк лёгкий": ["Здоровяк"],
        "Танк тяжёлый": ["Здоровяк"],
        "Сержант лёгкий": ["Следопыт"],
        "Сержант тяжёлый": ["Мастер древкового оружия"],
        "Второрядник лёгкий": ["Следопыт"],
        "Второрядник тяжёлый": ["Следопыт"],
        "Гибрид": ["Мастер меча"],
        "Рапирщик": ["Здоровяк"],
        "Кинжальщик": ["Мастер щита"],
        "Спартанец": ["Непоколебимый"],
        "Безфатиговый тяж": ["Командная работа"]
    };

    const repl = replaceable[archetype] || [];

    // Одна замена
    for (const perk of repl) {
        const index = template.indexOf(perk);
        if (index !== -1) {
            template[index] = "Одарённый";
            return template;
        }
    }

    return template;
}

    // Если боец проходит пороги — проверяем недобор и корректируем билд

function statToLabel(key) {
    const labels = {
        hp: "ОЗ",
        fat: "Вын",
        res: "Ршм",
        init: "Инц",
        matk: "АткБ",
        ratk: "АткД",
        mdef: "ЗащБ",
        rdef: "ЗащД"
    };
    return labels[key] || key;
}

function handleGenerate() {
    const inputStats = getInputStats();
    const stars = getStarValues();
    const allArchetypes = Object.keys(buildTemplates);
    const matching = [];

    for (const archetype of allArchetypes) {
        const finals = calcFinalsForArchetype(inputStats, stars, archetype);
        if (meetsThresholds(finals, archetype)) {
            const score = calculateScore(finals, stars, archetype);
            matching.push({ archetype, finals, score });
        }
    }

    if (matching.length === 0) {
    let closestArch = null;
    let closestDiff = Infinity;
    let closestFinals = null;
    let closestDetails = [];
    const allArchetypes = Object.keys(buildTemplates);

    for (const archetype of allArchetypes) {
        const archFinals = calcFinalsForArchetype(inputStats, stars, archetype);
        const t = getThresholdsForArchetype(archetype);
        let totalDiff = 0;
        let failed = false;
        const details = [];

        for (const [stat, minVal] of Object.entries(t.min || {})) {
            const val = archFinals[stat] || 0;
            if (val < minVal) {
                const diff = minVal - val;
                totalDiff += diff;
                failed = true;
                details.push(`${statToLabel(stat)}: ${val}/${minVal} (недобор ${diff})`);
            }
        }
        for (const [stat, maxVal] of Object.entries(t.max || {})) {
            const val = archFinals[stat] || 0;
            if (val >= maxVal) {
                const diff = val - maxVal + 1;
                totalDiff += diff;
                failed = true;
                details.push(`${statToLabel(stat)}: ${val} (макс: <${maxVal}, превышение ${diff})`);
            }
        }

        if (failed && totalDiff <= closestDiff) {
            closestDiff = totalDiff;
            closestArch = archetype;
            closestFinals = archFinals;
            closestDetails = details;
        }
    }

    if (!closestFinals) {
        const universal = {};
        for (const key of Object.keys(inputStats)) {
            universal[key] = Math.round(inputStats[key] + growth[key][stars[key]].avg * 3);
        }
        closestFinals = universal;
    }

    document.getElementById("infoBar").classList.add("active");

        <span>Ршм: ${closestFinals.res}</span>
        <span>Инц: ${closestFinals.init}</span>
        <span>АткБ: ${closestFinals.matk}</span>
        <span>АткД: ${closestFinals.ratk}</span>
        <span>ЗащБ: ${closestFinals.mdef}</span>
        <span>ЗащД: ${closestFinals.rdef}</span>
    `;

    let badgeText = "Финальные значения (11 ур.)";
    if (closestDetails.length > 0) {
        badgeText += ` — ${closestDetails.join("; ")}`;
    }
    document.getElementById("scoreBadge").textContent = badgeText;

    // Выводим билд ближайшего архетипа
    if (closestArch) {
        generateBuild(closestArch, inputStats, stars, true);
    } else {
        document.getElementById("perkGrid").innerHTML =
            '<div class="placeholder">Братец не дотягивает до нормального бойца. Я бы уволил.</div>';
    }
    return;
}

function generateStatScale(backgrounds, growth) {
    const stats = ['hp', 'fat', 'matk', 'mdef', 'ratk', 'rdef', 'init', 'res'];
    const result = {};

    stats.forEach(stat => {
        const allValues = [];

        backgrounds.forEach(bg => {
            const range = bg[stat];
            if (!range) return;
            const [minInit, maxInit] = range;

            // Перебираем каждое стартовое значение в диапазоне бэкграунда
            for (let start = minInit; start <= maxInit; start++) {
                // Для каждого количества звёзд
                for (let stars = 0; stars <= 3; stars++) {
                    const gainTable = growth[stat];
                    if (!gainTable || !gainTable[stars]) continue;
                    const gain = gainTable[stars];

                    // Только 10 прокачек (максимальный уровень)
                    allValues.push(start + gain.min * 8);
                    allValues.push(start + gain.avg * 8);
                    allValues.push(start + gain.max * 8);
					
                }
            }
        });

        // Сортируем все возможные финальные значения
        allValues.sort((a, b) => a - b);

        // Отрезаем по 2% снизу и сверху (выбросы)
        const totalCount = allValues.length;
        const cutBottom = Math.floor(totalCount * 0.000);
        const cutTop = Math.floor(totalCount * 0.000);
        const trimmedValues = allValues.slice(cutBottom, totalCount - cutTop);

        const minVal = trimmedValues[0];
        const maxVal = trimmedValues[trimmedValues.length - 1];

        // Делим на 10 равных отрезков
        const scale = [];
        for (let i = 0; i <= 30; i++) {
            const value = minVal + (maxVal - minVal) * (i / 30);
            scale.push(Math.round(value * 100) / 100);
        }

        result[stat] = scale;
    });

    return result;
}

const statScale = generateStatScale(backgrounds, growth);
function getStatLimits() {
    const stats = ['hp', 'fat', 'res', 'init', 'matk', 'ratk', 'mdef', 'rdef'];
    const limits = {};

    stats.forEach(stat => {
        let minVal = Infinity;
        let maxVal = -Infinity;

        backgrounds.forEach(bg => {
            const range = bg[stat];
            if (!range) return;
            if (range[0] < minVal) minVal = range[0];
            if (range[1] > maxVal) maxVal = range[1];
        });

        limits[stat] = { min: minVal, max: maxVal };
    });

    return limits;
}

const statLimits = getStatLimits();

function clampInput(input, stat) {
    const limits = statLimits[stat];
    if (!limits) return;
    
    let value = parseInt(input.value);
    if (isNaN(value)) return;
    
    if (value > limits.max) {
        input.value = limits.max;
    } else if (value < limits.min) {
        input.value = limits.min;
    }
}

function getAllFinalValues(stat) {
    const allValues = [];

    backgrounds.forEach(bg => {
        const range = bg[stat];
        if (!range) return;
        const [minInit, maxInit] = range;

        for (let start = minInit; start <= maxInit; start++) {
            for (let stars = 0; stars <= 3; stars++) {
                const gainTable = growth[stat];
                if (!gainTable || !gainTable[stars]) continue;
                const gain = gainTable[stars];

                // Только финальные значения (10 прокачек)
                allValues.push(Math.round(start + gain.min * 8));
                allValues.push(Math.round(start + gain.avg * 8));
                allValues.push(Math.round(start + gain.max * 8));
            }
        }
    });

    return allValues;
}

function buildHistogram(values, bucketSize = 5) {
    const min = Math.min(...values);
    const max = Math.max(...values);
    const buckets = {};
    const bucketCount = Math.ceil((max - min) / bucketSize);

    for (let i = 0; i < bucketCount; i++) {
        const bucketStart = min + i * bucketSize;
        const bucketEnd = bucketStart + bucketSize;
        const label = `${bucketStart}-${bucketEnd - 1}`;
        buckets[label] = 0;
    }

    values.forEach(v => {
        const bucketIndex = Math.floor((v - min) / bucketSize);
        const bucketStart = min + bucketIndex * bucketSize;
        const bucketEnd = bucketStart + bucketSize;
        const label = `${bucketStart}-${bucketEnd - 1}`;
        if (buckets[label] !== undefined) {
            buckets[label]++;
        }
    });

    return buckets;
}

function drawChart(stat) {
    const canvas = document.getElementById("distChart");
    const ctx = canvas.getContext("2d");
    const values = getAllFinalValues(stat);

    // Считаем частоту каждого значения
    const frequency = {};
    values.forEach(v => {
        frequency[v] = (frequency[v] || 0) + 1;
    });

    // Сортируем ключи (значения характеристик)
    const keys = Object.keys(frequency).map(Number).sort((a, b) => a - b);
    const data = keys.map(k => frequency[k]);
    const maxCount = Math.max(...data);

    // Если слишком много столбцов — предупреждаем
    if (keys.length > 80) {
        console.warn("Слишком много значений для отображения: " + keys.length);
    }

    // Очистка
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const padding = { top: 30, right: 30, bottom: 70, left: 60 };
    const chartWidth = canvas.width - padding.left - padding.right;
    const chartHeight = canvas.height - padding.top - padding.bottom;

    // Оси
    ctx.strokeStyle = "#6f552d";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left, canvas.height - padding.bottom);
    ctx.lineTo(canvas.width - padding.right, canvas.height - padding.bottom);
    ctx.stroke();

    // Подписи оси Y
    ctx.fillStyle = "#c7b38a";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    const ySteps = 5;
    for (let i = 0; i <= ySteps; i++) {
        const y = padding.top + (chartHeight / ySteps) * i;
        const val = Math.round(maxCount - (maxCount / ySteps) * i);
        ctx.fillText(val, padding.left - 10, y + 4);
        ctx.strokeStyle = "#3a2e20";
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(canvas.width - padding.right, y);
        ctx.stroke();
    }

    // Столбцы — по одному на каждое значение
    const barWidth = Math.max(1, chartWidth / keys.length - 1);

    keys.forEach((key, i) => {
        const x = padding.left + i * (chartWidth / keys.length);
        const count = frequency[key];
        const barHeight = (count / maxCount) * chartHeight;
        const y = canvas.height - padding.bottom - barHeight;

        // Градиент
        const gradient = ctx.createLinearGradient(x, y, x, canvas.height - padding.bottom);
        gradient.addColorStop(0, "#d4af37");
        gradient.addColorStop(1, "#7b5b2c");
        ctx.fillStyle = gradient;
        ctx.fillRect(x, y, barWidth, barHeight);

        // Значение над столбцом (только если помещается)
        if (barWidth > 4 && count > maxCount * 0.1) {
            ctx.fillStyle = "#fff";
            ctx.font = "8px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(count, x + barWidth / 2, y - 3);
        }
    });

    // Подписи оси X — каждое n-е значение, чтобы не слипались
    const step = Math.max(1, Math.ceil(keys.length / 20));
    ctx.textAlign = "center";
    keys.forEach((key, i) => {
        if (i % step === 0 || i === keys.length - 1) {
            ctx.save();
            ctx.translate(padding.left + i * (chartWidth / keys.length) + barWidth / 2, canvas.height - padding.bottom + 12);
            ctx.rotate(-0.6);
            ctx.fillStyle = "#c7b38a";
            ctx.font = "9px sans-serif";
            ctx.fillText(key, 0, 0);
            ctx.restore();
        }
    });

    // Заголовок
    ctx.fillStyle = "#d9b45a";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    const labels_full = {
        hp: "Здоровье (ОЗ)",
        fat: "Выносливость",
        res: "Решимость",
        init: "Инициатива",
        matk: "Атака ББ",
        ratk: "Атака ДБ",
        mdef: "Защита ББ",
        rdef: "Защита ДБ"
    };
    ctx.fillText(`Распределение: ${labels_full[stat]}`, canvas.width / 2, 20);
}

        let count = 0;

let currentLang = localStorage.getItem('bbLang') || 'ru';

function switchLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('bbLang', lang);
    const t = translationsOptimal[lang];

    document.querySelector('h2').textContent = t.subtitle;
    document.getElementById('generateBtn').textContent = t.generateBtn;
    document.getElementById('resetBtn').textContent = t.resetBtn;
    document.getElementById('modalCancel').textContent = t.modalCancel;

    // Лейблы характеристик
    const labels = {
        hp: t.statHp, fat: t.statFat, res: t.statRes, init: t.statInit,
        matk: t.statMatk, ratk: t.statRatk, mdef: t.statMdef, rdef: t.statRdef
    };
    const statGroups = document.querySelectorAll('.stat-group label');
    const labelKeys = ['hp', 'fat', 'res', 'init', 'matk', 'ratk', 'mdef', 'rdef'];
    statGroups.forEach((label, i) => {
        if (labelKeys[i]) label.textContent = labels[labelKeys[i]];
    });

    // Плейсхолдер
    const ph = document.querySelector('#perkGrid .placeholder');
    if (ph) ph.textContent = t.placeholder;

    // Переключаем язык перков
    setPerkLanguage(lang);

    // Кнопки
    // Перерисовываем уже отображённые перки
    const existingCards = document.querySelectorAll('#perkGrid .perk');
    if (existingCards.length > 0) {
        existingCards.forEach(card => {
            const titleEl = card.querySelector('.perk-title');
            const tooltipEl = card.querySelector('.tooltip');
            const currentName = titleEl.textContent;
            
            let perk = perks.find(p => p.name === currentName);
            if (!perk) {
                perk = perks.find(p => {
                    const trans = perkTranslations[p.name];
                    return trans && trans.en && trans.en.name === currentName;
                });
            }
            
            if (perk) {
                const display = getPerkDisplay(perk);
                titleEl.textContent = display.name;
                tooltipEl.innerHTML = display.description;
            }
        });
    }

    // Перерисовываем инфо-бар, если он активен
    const infoBar = document.getElementById('infoBar');
    if (infoBar.classList.contains('active')) {
        const archLabel = document.getElementById('archLabel');
        const scoreBadge = document.getElementById('scoreBadge');
        const statsSummary = document.getElementById('statsSummary');
        
        const currentText = archLabel.textContent;
        if (currentText.includes('⚠️') || currentText.includes('⚠')) {
            archLabel.textContent = t.weakBroAlt;
        } else {
            let archName = currentText.replace('Архетип: ', '').replace('Archetype: ', '');
            
            for (const [ruName, trans] of Object.entries(archetypeTranslations)) {
                if (trans.en === archName) {
                    archName = ruName;
                    break;
                }
            }
            
            archLabel.textContent = t.archPrefix + getArchName(archName);
        }
        
        scoreBadge.textContent = t.finalStats;
        
        const statSpans = statsSummary.querySelectorAll('span');
        if (statSpans.length >= 8) {
            const newLabels = [t.oz, t.vyn, t.rshm, t.inc, t.atkb, t.atkd, t.zashb, t.zashd];
            statSpans.forEach((span, i) => {
                if (newLabels[i]) {
                    const value = span.textContent.split(': ')[1];
                    if (value) span.textContent = newLabels[i] + ': ' + value;
                }
            });
        }
    }

    document.getElementById('langRu').classList.toggle('active', lang === 'ru');
    document.getElementById('langEn').classList.toggle('active', lang === 'en');

    window._currentLang = lang;
}

// Обновляем блок «дна» в handleGenerate
const originalHandleGenerate = handleGenerate;
handleGenerate = function() {
    const inputStats = getInputStats();
    const stars = getStarValues();
    const allArchetypes = Object.keys(buildTemplates);
    const matching = [];

    for (const archetype of allArchetypes) {
        const finals = calcFinalsForArchetype(inputStats, stars, archetype);
        if (meetsThresholds(finals, archetype)) {
            const score = calculateScore(finals, stars, archetype);
            matching.push({ archetype, finals, score });
        }
    }

    if (matching.length === 0) {
        let closestArch = null;
        let closestDiff = Infinity;
        let closestFinals = null;
        let closestDetails = [];
        const allArchetypes = Object.keys(buildTemplates);
        const t = translationsOptimal[currentLang];

        for (const archetype of allArchetypes) {
            const archFinals = calcFinalsForArchetype(inputStats, stars, archetype);
            const th = getThresholdsForArchetype(archetype);
            let totalDiff = 0;
            let failed = false;
            const details = [];

            for (const [stat, minVal] of Object.entries(th.min || {})) {
                const val = archFinals[stat] || 0;
                if (val < minVal) {
                    const diff = minVal - val;
                    totalDiff += diff;
                    failed = true;
                    details.push(`${statToLabel(stat)}: ${val}/${minVal} (недобор ${diff})`);
                }
            }
            for (const [stat, maxVal] of Object.entries(th.max || {})) {
                const val = archFinals[stat] || 0;
                if (val >= maxVal) {
                    const diff = val - maxVal + 1;
                    totalDiff += diff;
                    failed = true;
                    details.push(`${statToLabel(stat)}: ${val} (макс: <${maxVal}, превышение ${diff})`);
                }
            }

            if (failed && totalDiff <= closestDiff) {
                closestDiff = totalDiff;
                closestArch = archetype;
                closestFinals = archFinals;
                closestDetails = details;
            }
        }

        if (!closestFinals) {
            const universal = {};
            for (const key of Object.keys(inputStats)) {
                universal[key] = Math.round(inputStats[key] + growth[key][stars[key]].avg * 3);
            }
            closestFinals = universal;
        }

        document.getElementById("infoBar").classList.add("active");
        document.getElementById("archLabel").textContent = t.weakBroAlt;
        document.getElementById("statsSummary").innerHTML = `
            <span>${t.oz}: ${closestFinals.hp}</span>
            <span>${t.vyn}: ${closestFinals.fat}</span>
            <span>${t.rshm}: ${closestFinals.res}</span>
            <span>${t.inc}: ${closestFinals.init}</span>
            <span>${t.atkb}: ${closestFinals.matk}</span>
            <span>${t.atkd}: ${closestFinals.ratk}</span>
            <span>${t.zashb}: ${closestFinals.mdef}</span>
            <span>${t.zashd}: ${closestFinals.rdef}</span>
        `;

        let badgeText = t.finalStats;
        if (closestDetails.length > 0) {
            badgeText += ` — ${closestDetails.join("; ")}`;
        }
        document.getElementById("scoreBadge").textContent = badgeText;

        if (closestArch) {
            generateBuild(closestArch, inputStats, stars, true);
        } else {
            document.getElementById("perkGrid").innerHTML = '<div class="placeholder">' + t.noGood + '</div>';
        }
        return;
    }

    matching.sort((a, b) => b.score - a.score);

    if (matching.length === 1) {
        generateBuild(matching[0].archetype, inputStats, stars);
    } else {
        const top2 = matching.slice(0, 2);
        showArchetypeModal(top2, inputStats, stars);
    }
};
